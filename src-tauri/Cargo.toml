[package]
name = "photovault"
version = "0.2.0"
description = "Password-locked encrypted photo & video library"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
scrypt = "0.11"
rand = "0.8"
image = "0.25"
kamadak-exif = "0.6"
base64 = "0.22"
hex = "0.4"
blake3 = "1"
zeroize = "1"
zip = { version = "2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSOperation",
    "NSString",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSWindow",
    "NSResponder",
] }
core-foundation = "0.10"

[profile.release]
strip = true
lto = true
